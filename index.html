      /* Safe environment shim: Ensure window.fetch is writable and handle getter-only environments */
      (function() {
        try {
          var currentFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
          
          // Define setter on window instance
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            }
          });

          // Also ensure Window.prototype has a setter if configured there
          if (typeof Window !== 'undefined' && Window.prototype) {
            var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (protoDesc && !protoDesc.set && protoDesc.configurable) {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return currentFetch;
                },
                set: function(val) {
                  currentFetch = val;
                }
              });
            }
          }
        } catch (_) {}

        // Global safeguard against unhandled errors originating from getter-only window properties
        window.addEventListener('error', function(event) {
          if (event && event.message && (
            event.message.indexOf('fetch of #<Window>') !== -1 ||
            event.message.indexOf('Cannot set property fetch') !== -1
          )) {
            event.preventDefault();
            if (event.stopImmediatePropagation) {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);
      })();
    </script>
